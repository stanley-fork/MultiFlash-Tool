name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      - name: Install Qt
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.7.3 win64_msvc2022_64 --modules qtsvg --outputdir "${{ github.workspace }}\qt"

      - name: Configure
        shell: pwsh
        run: |
          $qtPrefix = "${{ github.workspace }}\qt\6.7.3\msvc2022_64"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$qtPrefix"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy Qt Runtime
        shell: pwsh
        run: |
          $qtPrefix = "${{ github.workspace }}\qt\6.7.3\msvc2022_64"
          & "$qtPrefix\bin\windeployqt.exe" --release --no-translations "build\SAKURAEDL.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sakuraedl-windows-build
          path: |
            build/SAKURAEDL.exe
            build/*.dll
            build/platforms/**
            build/styles/**
            build/iconengines/**
            build/imageformats/**
          if-no-files-found: warn
