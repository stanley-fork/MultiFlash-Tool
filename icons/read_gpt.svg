<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Table/list representation for partition table -->
  <rect x="3" y="2" width="18" height="20" rx="2" stroke="#5B7B8E" fill="#5B7B8E" fill-opacity="0.10"/>
  <!-- Header row -->
  <rect x="3" y="2" width="18" height="5" rx="2" stroke="none" fill="#5B7B8E" fill-opacity="0.25"/>
  <!-- Row lines -->
  <line x1="5" y1="10" x2="19" y2="10" stroke="#5B7B8E" stroke-width="1.5"/>
  <line x1="5" y1="14" x2="19" y2="14" stroke="#5B7B8E" stroke-width="1.5"/>
  <line x1="5" y1="18" x2="15" y2="18" stroke="#5B7B8E" stroke-width="1.5"/>
  <!-- Magnifier glass (read/inspect) -->
  <circle cx="17.5" cy="17" r="3" stroke="#5B7B8E" stroke-width="1.6" fill="white" fill-opacity="0.8"/>
  <line x1="19.7" y1="19.2" x2="21.5" y2="21" stroke="#5B7B8E" stroke-width="1.8"/>
</svg>
